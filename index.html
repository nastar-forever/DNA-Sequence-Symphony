<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>DNA Sequence Symphony</title>
</head>
<body>
    <main>
        <h1 class="mainscreen-title">Create a symphony by writing a DNA sequence!</h1>
        <h1 class="acgt-title a-color">A</h1>
        <h1 class="acgt-title c-color">C</h1>
        <h1 class="acgt-title g-color">G</h1>
        <h1 class="acgt-title t-color">T</h1>

        <div class="mainscreen flex-column">
            <div class="flex-row">
                <div class="flex-row flex-wrap">
                    <button class="cellular-outline playback-button playbttn"></button>
                    <div class="slider-wrapper playbar-wrapper">
                        <input value="0" min="0" max="1000" class="playbar" type="range">
                    </div>

                    <div class="flex-row master-settings cellular-outline">
                        <div class="flex-row inline-setting">
                            <h3 class="row-title">BPM</h3>
                            <input id="mastersttg-bpm-field" class="cellular-outline standard-number-field" type="number" min="1" max="999" value="240">
                        </div>


                        <div class="flex-row inline-setting field-slider-pair" data-fieldid="mastersttg-gain-field" data-sliderid="mastersttg-gain-slider">
                            <h3 class="row-title">GAIN</h3>
                            <input id="mastersttg-gain-field" class="cellular-outline standard-number-field decimal-field" min="0.001" value="0.2" max="1.0" type="number">
                            <div class="slider-wrapper">
                                <input id="mastersttg-gain-slider" value="200" min="0" max="1000" type="range">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <br>

            <div class="flex-row">
                <div data-seqid="0" class="flex-column sequence-block">
                    <div data-seqid="0" class="flex-row dnabars-parent"></div>

                    <div class="flex-row cellular-outline dnaentry-parent">
                        <textarea wrap="off" rows="1" data-seqid="0" class="dnaentry-input" placeholder="Enter DNA sequence here (ACGT)..."></textarea>
                        <button data-seqid="0" class="dnaentry-settings"></button>
                    </div>
                </div>
            </div>

            <button class="add-sequence-button cellular-outline">+ Add Sequence</button>
        </div>

        <div id="settings-screenblur" class="screen-blur">
            <div id="settings-screen" class="screen flex-column dna-dot-border">
                <div class="flex-row screen-header">
                    <h1 class="row-title">Settings</h1>
                    <button id="settings-close" class="close-button"></button>
                </div>

                <form id="settings-form" class="screen-main-column flex-column">
                    <div class="flex-row settings-row">
                        <label for="sttg-wet-field" class="flex-column row-title">
                            <div>Reverb wet gain</div>
                            <div class="subtext">Can't exceed 1.0</div>
                        </label>

                        <div class="flex-row field-slider-pair" data-sliderid="sttg-wet-slider" data-fieldid="sttg-wet-field">
                            <input id="sttg-wet-field" type="number" value="0.3" min="0.0" max="1.0" step="0.001" name="wet" class="cellular-outline standard-number-field decimal-field">
                            <div class="slider-wrapper">
                                <input id="sttg-wet-slider" type="range" value="300" min="0" max="1000">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="apply-button cellular-outline" id="settings-apply">Apply</button>
                </form>
            </div>

            <div id="settings-unsaved-confirm-box" class="screen confirm-box flex-column dna-dot-border">
                <div class="screen-header">
                    <h1 class="row-title">Attention!</h1>
                </div>

                <div class="screen-main-column">
                    <div>You have unapplied setting(s), continue to exit settings?</div>
                    <div class="flex-row settings-row">
                        <button class="cellular-outline settings-unsaved-button" id="settings-unsaved-cancel">Cancel</button>
                        <button class="cellular-outline settings-unsaved-button" id="settings-unsaved-exit">Exit</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="flex-row error notification">
        <h1 class="row-title">huh!?</h1>
        <p class="notification-msg">Error message should be displayed here. If not, something terrible is happening.</p>
        <button class="close-button"></button>
    </div>

    <footer>
        <p>Made for <a href="https://terra.hackclub.com">Terra</a>, by <a href="https://github.com/nastar-forever">@nastavial</a>
        </p>
    </footer>

    <script type="module" src="dist/main.js"></script>
</body>
</html>
